
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meet Ginger ♡</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="winter-world">

        <header>
            <h1>Welcome to Ginger's World ♡</h1>
            <p>A little house full of holiday magic...</p>
        </header>

        <section class="scene">

            <div class="house-scene" tabindex="0"
                 aria-label="Hover over the gingerbread house to meet Ginger">

                <!-- Gingerbread house image -->
                <img
                    src="gingerbread-house.png"
                    alt="A cute pastel gingerbread house"
                    class="house-art"
                >

                <!-- Gingerbread person image -->
                <img
                    src="gingerbread-person.png"
                    alt="Ginger the gingerbread person"
                    class="gingerbread-person"
                >

            </div>

            <p class="hint">Psst... hover over the house to meet Ginger!</p>

        </section>

        <!-- Decorative snowflakes -->
        <div class="snowflake snowflake-one">❄</div>
        <div class="snowflake snowflake-two">✧</div>
        <div class="snowflake snowflake-three">❄</div>
        <div class="snowflake snowflake-four">✦</div>
        <div class="snowflake snowflake-five">❄</div>
        <div class="snowflake snowflake-six">✧</div>

    </main>

</body>
</html>
